name: english_circle
description: "EnglishCircle - English speaking practice app for institute community."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # Agora RTC
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  
  # ML Kit for English detection
  google_ml_kit: ^0.18.0
  
  # State management
  provider: ^6.1.2
  
  # UI & utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_sound: ^9.11.3
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # Chat & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  
  # WebView for AI Agent
  flutter_inappwebview: ^6.0.0
  country_picker: ^2.0.27
  
  # PayHere Payment Gateway
  payhere_mobilesdk_flutter: ^3.0.8
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/splash/
